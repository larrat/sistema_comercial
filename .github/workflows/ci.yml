name: Integração Contínua (CI)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  verify:
    name: Validar Código e Testes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Instalar Dependências
        run: npm ci

      - name: Verificar Formatação (Prettier)
        run: npm run format:check

      - name: Análise Estática (ESLint)
        run: npm run lint

      - name: Verificação de Tipos (TypeScript)
        run: npm run typecheck

      - name: Executar Testes React (Vitest)
        run: npm run test:react

      - name: Build da Aplicação
        run: npm run build:react

      - name: Instalar Navegadores do Playwright
        run: npx playwright install --with-deps chromium

      - name: Executar Testes E2E (Playwright)
        run: npm run test:e2e

      - name: Upload de Relatórios Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
